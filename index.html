<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Eastern Protocols - Crypto Payout</title>
  <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="page">
    <header class="page-header">
      <div class="header-left">
        <p class="label">Eastern Protocols</p>
        <h1>Payment terminal</h1>
      </div>
      <div class="header-right">
        <div class="mode-label">
          <p class="label">Mode</p>
          <p class="value">Crypto deposit</p>
        </div>
      </div>
    </header>

    <div class="columns">
      <section class="col sale-col">
        <h2>Sale</h2>
        <p class="total-line">Total<span id="saleTotal">$0.00</span></p>
        <div id="productList" class="products"></div>
      </section>

      <section class="col payment-col">
        <h2>Payment</h2>
        <p class="accept-label">Crypto deposit only</p>

        <form id="paymentForm" class="payment-form">
          <div class="form-group">
            <label>Wallet address</label>
            <input type="text" id="walletAddr" placeholder="0x..." required />
          </div>

          <div class="form-group">
            <label>Network</label>
            <select id="network" required>
              <option value="ETH">Ethereum</option>
              <option value="USDT">Tether (USDT)</option>
              <option value="BTC">Bitcoin</option>
            </select>
          </div>

          <div class="form-group">
            <label>Crypto amount</label>
            <input type="text" id="cryptoAmount" placeholder="0.05" required />
          </div>

          <div class="form-group">
            <label>Approval code</label>
            <input type="text" id="approvalCode" placeholder="APP-0001" required />
          </div>

          <p class="note">Demo rate: $1 = €0.92</p>

          <button class="btn-submit" type="submit">Process payout</button>
        </form>
      </section>
    </div>

    <section class="store-section">
      <h2>Transaction store</h2>
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>Time</th>
              <th>Mode</th>
              <th>Type</th>
              <th>Amount</th>
              <th>Stored wallet data</th>
              <th>Approval code</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="txTable">
            <tr class="empty-msg">
              <td colspan="7">No sales yet. Take a payment to fill the store.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
